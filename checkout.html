<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Out Component - CEIT</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
    }
    h1 { font-size: 1.3rem; margin-bottom: 6px; }
    p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #cbd5e1; }
    input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 8px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #334155;
      margin-top: 8px;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    .btn-secondary:hover { background: #475569; }
    .item-preview {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Sign Out Component</h1>
  <p>Enter the item code or scan the component QR code</p>

  <div id="error-box" class="error-msg"></div>

  <div class="form-group">
    <label for="code-input">Component Code</label>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="code-input" placeholder="e.g. ARD-01" autofocus>
      <button id="btn-lookup" type="button" class="btn" style="width: auto; margin-top: 0; padding: 0 16px;">Find</button>
    </div>
  </div>

  <div id="preview-box" class="item-preview">
    <div style="font-weight: 600; font-size: 1rem;" id="prev-name">-</div>
    <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;" id="prev-category">-</div>
    <div style="margin-top: 8px; font-size: 0.85rem;">
      Available: <strong id="prev-avail" style="color: #34d399;">0</strong>
    </div>
  </div>

  <div class="form-group">
    <label for="duration-select">Loan Duration</label>
    <select id="duration-select">
      <option value="1">1 Day (Class period / Today)</option>
      <option value="3">3 Days</option>
      <option value="7" selected>1 Week (Default)</option>
      <option value="14">2 Weeks</option>
    </select>
  </div>

  <button id="btn-confirm" class="btn" disabled>Confirm Sign Out</button>
  <a href="dashboard.html" class="btn btn-secondary">Cancel & Back to Dashboard</a>
</div>

<script type="module">
  import { observeAuthState } from "./js/services/auth-service.js";
  import { getItemByCode } from "./js/services/item-service.js";
  import { checkOutItem } from "./js/services/checkout-service.js";

  let currentUser = null;
  let foundItem = null;

  const errorBox = document.getElementById("error-box");
  const codeInput = document.getElementById("code-input");
  const previewBox = document.getElementById("preview-box");
  const confirmBtn = document.getElementById("btn-confirm");

  function showError(msg) {
    if (!msg) {
      errorBox.style.display = "none";
      return;
    }
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }

  observeAuthState((user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }
    currentUser = user;
  });

  async function lookup() {
    showError("");
    const code = codeInput.value.trim();
    if (!code) return;

    try {
      const item = await getItemByCode(code);
      if (!item) {
        showError(`No component found with code "${code}".`);
        previewBox.style.display = "none";
        confirmBtn.disabled = true;
        foundItem = null;
        return;
      }

      foundItem = item;
      document.getElementById("prev-name").textContent = item.name;
      document.getElementById("prev-category").textContent = `${item.category} • ${item.code}`;
      document.getElementById("prev-avail").textContent = `${item.availableQuantity} of ${item.totalQuantity}`;

      previewBox.style.display = "block";
      confirmBtn.disabled = item.availableQuantity <= 0;

      if (item.availableQuantity <= 0) {
        showError(`This component is currently out of stock (0 available).`);
      }
    } catch (err) {
      showError(err.message);
    }
  }

  document.getElementById("btn-lookup").addEventListener("click", lookup);
  codeInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      lookup();
    }
  });

  confirmBtn.addEventListener("click", async () => {
    if (!foundItem || !currentUser) return;
    confirmBtn.disabled = true;
    confirmBtn.textContent = "Signing out...";

    try {
      const durationDays = parseInt(document.getElementById("duration-select").value, 10);
      await checkOutItem({
        itemId: foundItem.id,
        user: currentUser,
        durationDays
      });
      alert(`Successfully checked out ${foundItem.name}!`);
      window.location.href = "dashboard.html";
    } catch (err) {
      showError(err.message);
      confirmBtn.disabled = false;
      confirmBtn.textContent = "Confirm Sign Out";
    }
  });
</script>

</body>
</html>
