<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com wss://*.firebaseio.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firestore.googleapis.com; frame-src 'self' https://compengit.firebaseapp.com https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Check Out Component — CEIT</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
</head>
<body class="auth-pending">

<header class="site-header">
  <div class="header-inner">
    <div class="brand-group">
      <a href="dashboard.html" class="brand-wordmark">
        <img src="assets/logo-nav.svg" alt="" class="brand-logo" width="30" height="30">
        <span>CEIT</span>
      </a>
      <span class="brand-tag">PDSB</span>
    </div>

    <nav class="main-nav" aria-label="Main Navigation">
      <a href="teacher.html" id="nav-teacher-link" style="display: none;">Teacher Panel</a>
      <a href="dashboard.html" id="nav-dash">Dashboard</a>
      <a href="checkout.html" class="active">Check Out</a>
      <a href="docs.html">Docs</a>
    </nav>

    <div class="header-user">
      <span class="user-pill">
        <strong id="student-name">Loading...</strong>
        <span class="user-pill-id" id="student-number-pill">#—</span>
      </span>
      <button type="button" id="btn-logout" class="btn-nav-signout">Sign Out</button>
    </div>
  </div>
</header>

<main class="page-wrapper" style="max-width: 780px;">
  <div class="page-header">
    <h1>Check Out Component</h1>
    <a href="dashboard.html" class="btn btn-ghost">&larr; Dashboard</a>
  </div>

  <div id="alert-box" class="alert alert-danger" style="display: none;"></div>
  <div id="success-box" class="alert alert-success" style="display: none;"></div>

  <form id="checkout-form" novalidate>

    <!-- STEP 1: Component Code + Inline QR Scanner -->
    <section class="step-block">
      <div class="step-block-header">
        <div>
          <span class="step-num">1</span>
          <strong>Component</strong>
        </div>
        <span class="badge badge-neutral" id="preview-badge">Not Selected</span>
      </div>
      <div class="step-block-body">
        <div class="form-group">
          <label for="code-input">Component Code</label>
          <div class="input-inline">
            <input type="text" id="code-input" placeholder="MCU-ARDUN-01" maxlength="32" autocomplete="off" autofocus>
            <button type="button" id="btn-lookup" class="btn btn-primary">Find</button>
            <button type="button" id="btn-toggle-qr" class="btn btn-ghost">Scan QR</button>
          </div>
        </div>

        <!-- Inline QR Scanner Drawer -->
        <div id="scanner-drawer" class="scanner-drawer">
          <div id="scanner-box" class="scanner-box">
            <video id="qr-video" playsinline muted style="display: none;"></video>
            <div class="scanner-reticle" aria-hidden="true"></div>
            <div id="scanner-placeholder" class="scanner-placeholder">
              <p class="fw-bold">Camera QR Scanner</p>
            </div>
          </div>
          <canvas id="qr-canvas" style="display: none;"></canvas>

          <div class="btn-row mb-8">
            <button type="button" id="btn-start-cam" class="btn btn-primary btn-sm">Start Camera</button>
            <button type="button" id="btn-stop-cam" class="btn btn-ghost btn-sm" disabled>Stop</button>
            <button type="button" id="btn-flip-cam" class="btn btn-ghost btn-sm" style="display: none;">Flip</button>
            <button type="button" id="btn-close-qr" class="btn btn-ghost btn-sm" style="margin-left: auto;">Close</button>
          </div>

          <div id="scanner-status" class="text-small text-muted mb-8">Camera off.</div>

          <div class="form-group" style="margin-bottom: 0; padding-top: 8px; border-top: 1px solid var(--border);">
            <label for="qr-file-input">QR Image File</label>
            <input type="file" id="qr-file-input" accept="image/*">
          </div>
        </div>

        <div class="form-group mt-12" style="margin-bottom: 0;">
          <label for="quick-select">In-Stock Inventory</label>
          <select id="quick-select">
            <option value="">-- Select component --</option>
          </select>
        </div>

        <!-- Inline Component Preview -->
        <div id="preview-box" class="component-preview" style="display: none;">
          <div class="component-preview-title" id="prev-name">—</div>
          <div class="component-meta-row">
            <span>Code: <code id="prev-code">—</code></span>
            <span>Category: <strong id="prev-category">—</strong></span>
            <span>Bin: <strong id="prev-location">—</strong></span>
            <span>Stock: <strong id="prev-avail-text">—</strong></span>
          </div>
          <div id="prev-notes" class="text-small text-muted mt-8" style="display: none;"></div>
        </div>
      </div>
    </section>

    <!-- STEP 2: Explicit Class Period Selection (No Default) -->
    <section class="step-block">
      <div class="step-block-header">
        <div>
          <span class="step-num">2</span>
          <strong>Class Period</strong>
        </div>
        <span class="badge badge-warn" id="period-status-badge">Required</span>
      </div>
      <div class="step-block-body">
        <div class="chip-group" id="period-chips" role="radiogroup" aria-label="Class Period">
          <button type="button" class="chip-btn" data-period="Period 1">Period 1</button>
          <button type="button" class="chip-btn" data-period="Period 2">Period 2</button>
          <button type="button" class="chip-btn" data-period="Period 3">Period 3</button>
          <button type="button" class="chip-btn" data-period="Period 4">Period 4</button>
        </div>
      </div>
    </section>

    <!-- STEP 3: Loan Details & Confirm -->
    <section class="step-block">
      <div class="step-block-header">
        <div>
          <span class="step-num">3</span>
          <strong>Loan Details</strong>
        </div>
        <span class="badge badge-accent" id="due-date-preview">—</span>
      </div>
      <div class="step-block-body">
        <div class="grid-2" style="gap: 12px;">
          <div class="form-group">
            <label for="checkout-student-num">PDSB ID</label>
            <input type="text" id="checkout-student-num" readonly>
          </div>

          <div class="form-group">
            <label for="checkout-notes">Note (Optional)</label>
            <input type="text" id="checkout-notes" placeholder="Optional note" maxlength="300">
          </div>
        </div>

        <div class="form-group">
          <label>Duration</label>
          <div class="chip-group" id="duration-chips" role="radiogroup" aria-label="Loan Duration">
            <button type="button" class="chip-btn" data-days="1">1 Day</button>
            <button type="button" class="chip-btn" data-days="3">3 Days</button>
            <button type="button" class="chip-btn active" data-days="7">1 Week</button>
            <button type="button" class="chip-btn" data-days="14">2 Weeks</button>
            <button type="button" class="chip-btn" data-days="custom">Custom</button>
          </div>
        </div>

        <div class="form-group" id="custom-days-group" style="display: none; max-width: 200px;">
          <label for="custom-days-input">Days (1–30)</label>
          <input type="number" id="custom-days-input" min="1" max="30" value="5">
        </div>

        <div class="btn-row mt-12">
          <button type="submit" id="btn-confirm" class="btn btn-success btn-lg" disabled>
            Confirm Sign Out
          </button>
          <a href="dashboard.html" class="btn btn-ghost btn-lg">Cancel</a>
        </div>
      </div>
    </section>

  </form>
</main>

<script type="module" src="./js/pages/checkout.js"></script>

</body>
</html>
