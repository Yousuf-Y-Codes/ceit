<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Panel - CEIT</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --danger: #ef4444;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label { font-size: 0.8rem; color: #cbd5e1; font-weight: 500; }
    input, select { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1 style="font-size: 1.4rem;">Teacher Admin Panel</h1>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Computer Engineering Item Tracker</p>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span id="teacher-email" style="font-size: 0.85rem; color: var(--text-muted);">Teacher</span>
      <button id="btn-logout" class="btn btn-secondary btn-sm">Sign Out</button>
    </div>
  </header>

  <div class="grid">
    <!-- Active Checkouts Table -->
    <div class="card">
      <h2 style="font-size: 1.15rem; margin-bottom: 8px;">Active Sign-Outs (<span id="count">0</span>)</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Component</th>
              <th>Student</th>
              <th>Student #</th>
              <th>Due Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="active-list">
            <tr><td colspan="5" style="color: var(--text-muted); text-align: center; padding: 24px;">No active sign-outs.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Add Component -->
    <div class="card">
      <h2 style="font-size: 1.15rem; margin-bottom: 12px;">Add New Component</h2>
      <form id="add-item-form">
        <div class="form-group">
          <label for="item-name">Component Name</label>
          <input type="text" id="item-name" placeholder="e.g. Arduino Uno" required>
        </div>
        <div class="form-group">
          <label for="item-code">Item Code (QR/Barcode)</label>
          <input type="text" id="item-code" placeholder="e.g. ARD-01" required>
        </div>
        <div class="form-group">
          <label for="item-category">Category</label>
          <select id="item-category">
            <option value="Microcontrollers">Microcontrollers</option>
            <option value="Sensors">Sensors</option>
            <option value="Components">Components</option>
            <option value="Cables & Tools">Cables & Tools</option>
          </select>
        </div>
        <div class="form-group">
          <label for="item-qty">Quantity</label>
          <input type="number" id="item-qty" value="5" min="1" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 8px;">Add Component</button>
      </form>
    </div>
  </div>
</div>

<script type="module">
  import { observeAuthState, signOutUser } from "./js/services/auth-service.js";
  import { createItem } from "./js/services/item-service.js";
  import { subscribeToAllActiveCheckouts, returnItem } from "./js/services/checkout-service.js";

  let currentUser = null;

  observeAuthState((user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }
    currentUser = user;
    document.getElementById("teacher-email").textContent = user.email || user.displayName;

    subscribeToAllActiveCheckouts((checkouts) => {
      document.getElementById("count").textContent = checkouts.length;
      const tbody = document.getElementById("active-list");
      if (checkouts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="color: var(--text-muted); text-align: center; padding: 24px;">No active sign-outs.</td></tr>';
        return;
      }

      tbody.innerHTML = checkouts.map((co) => {
        const dueDate = co.dueDate?.toDate ? co.dueDate.toDate().toLocaleDateString() : "N/A";
        return `
          <tr>
            <td><strong>${co.itemName}</strong><br><small style="color: var(--text-muted);">${co.itemCode}</small></td>
            <td>${co.studentName}</td>
            <td><code>${co.studentNumber || "N/A"}</code></td>
            <td>${dueDate}</td>
            <td>
              <button class="btn btn-secondary btn-sm btn-return" data-id="${co.id}">Check In</button>
            </td>
          </tr>
        `;
      }).join("");

      document.querySelectorAll(".btn-return").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          const id = e.target.getAttribute("data-id");
          if (confirm("Check this item back into inventory?")) {
            try {
              await returnItem(id, currentUser.email);
            } catch (err) {
              alert("Error returning item: " + err.message);
            }
          }
        });
      });
    });
  });

  document.getElementById("add-item-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const name = document.getElementById("item-name").value;
      const code = document.getElementById("item-code").value;
      const category = document.getElementById("item-category").value;
      const totalQuantity = document.getElementById("item-qty").value;

      await createItem({ name, code, category, totalQuantity }, currentUser.uid);
      alert(`Component "${name}" (${code}) added to inventory!`);
      document.getElementById("item-name").value = "";
      document.getElementById("item-code").value = "";
    } catch (err) {
      alert("Error adding item: " + err.message);
    }
  });

  document.getElementById("btn-logout").addEventListener("click", async () => {
    await signOutUser();
    window.location.href = "index.html";
  });
</script>

</body>
</html>
