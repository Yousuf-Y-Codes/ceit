<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CEIT Logo">
  <!-- IC Microcontroller Pins (3 per side) -->
  <g fill="#93c5fd">
    <rect x="18" y="2" width="4" height="7" rx="1"/>
    <rect x="30" y="2" width="4" height="7" rx="1"/>
    <rect x="42" y="2" width="4" height="7" rx="1"/>
    <rect x="18" y="55" width="4" height="7" rx="1"/>
    <rect x="30" y="55" width="4" height="7" rx="1"/>
    <rect x="42" y="55" width="4" height="7" rx="1"/>
    <rect x="2" y="18" width="7" height="4" rx="1"/>
    <rect x="2" y="30" width="7" height="4" rx="1"/>
    <rect x="2" y="42" width="7" height="4" rx="1"/>
    <rect x="55" y="18" width="7" height="4" rx="1"/>
    <rect x="55" y="30" width="7" height="4" rx="1"/>
    <rect x="55" y="42" width="7" height="4" rx="1"/>
  </g>

  <!-- Inverted White Chip Package Body for Dark Navbar -->
  <rect x="9" y="9" width="46" height="46" rx="3" fill="#ffffff"/>

  <!-- 3 QR Finder Squares inside the IC Die -->
  <rect x="16" y="16" width="13" height="13" rx="1" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
  <rect x="20" y="20" width="5" height="5" fill="#1e3a8a"/>

  <rect x="35" y="16" width="13" height="13" rx="1" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
  <rect x="39" y="20" width="5" height="5" fill="#1e3a8a"/>

  <rect x="16" y="35" width="13" height="13" rx="1" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
  <rect x="20" y="39" width="5" height="5" fill="#1e3a8a"/>

  <!-- Bottom-Right Blueprint Circuit Accent -->
  <g fill="#2563eb">
    <rect x="35" y="35" width="4.5" height="4.5"/>
    <rect x="43.5" y="35" width="4.5" height="4.5"/>
    <rect x="35" y="43.5" width="4.5" height="4.5"/>
    <rect x="41" y="41" width="7" height="7" rx="1"/>
  </g>
</svg>
