<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CEIT Logo">
  <!-- IC Microcontroller Pins (3 per side) -->
  <g fill="#67e8f9">
    <rect x="18" y="2" width="4" height="7" rx="1"/>
    <rect x="30" y="2" width="4" height="7" rx="1"/>
    <rect x="42" y="2" width="4" height="7" rx="1"/>
    <rect x="18" y="55" width="4" height="7" rx="1"/>
    <rect x="30" y="55" width="4" height="7" rx="1"/>
    <rect x="42" y="55" width="4" height="7" rx="1"/>
    <rect x="2" y="18" width="7" height="4" rx="1"/>
    <rect x="2" y="30" width="7" height="4" rx="1"/>
    <rect x="2" y="42" width="7" height="4" rx="1"/>
    <rect x="55" y="18" width="7" height="4" rx="1"/>
    <rect x="55" y="30" width="7" height="4" rx="1"/>
    <rect x="55" y="42" width="7" height="4" rx="1"/>
  </g>

  <!-- Crisp White Chip Package Body for Colorful Gradient Navbar -->
  <rect x="9" y="9" width="46" height="46" rx="4" fill="#ffffff"/>

  <!-- 3 QR Finder Squares inside the IC Die -->
  <rect x="16" y="16" width="13" height="13" rx="1.5" fill="none" stroke="#312e81" stroke-width="2.5"/>
  <rect x="20" y="20" width="5" height="5" fill="#4f46e5"/>

  <rect x="35" y="16" width="13" height="13" rx="1.5" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="39" y="20" width="5" height="5" fill="#06b6d4"/>

  <rect x="16" y="35" width="13" height="13" rx="1.5" fill="none" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="20" y="39" width="5" height="5" fill="#10b981"/>

  <!-- Bottom-Right Colorful Hardware LED / Circuit Pads -->
  <rect x="35" y="35" width="4.5" height="4.5" rx="0.8" fill="#f59e0b"/>
  <rect x="43.5" y="35" width="4.5" height="4.5" rx="0.8" fill="#06b6d4"/>
  <rect x="35" y="43.5" width="4.5" height="4.5" rx="0.8" fill="#10b981"/>
  <rect x="41" y="41" width="7" height="7" rx="1.2" fill="#ec4899"/>
</svg>
