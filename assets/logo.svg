<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CEIT Logo">
  <defs>
    <linearGradient id="chip-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <!-- IC Microcontroller Pins (3 per side) -->
  <g fill="#38bdf8">
    <rect x="18" y="2" width="4" height="7" rx="1"/>
    <rect x="30" y="2" width="4" height="7" rx="1"/>
    <rect x="42" y="2" width="4" height="7" rx="1"/>
    <rect x="18" y="55" width="4" height="7" rx="1"/>
    <rect x="30" y="55" width="4" height="7" rx="1"/>
    <rect x="42" y="55" width="4" height="7" rx="1"/>
    <rect x="2" y="18" width="7" height="4" rx="1"/>
    <rect x="2" y="30" width="7" height="4" rx="1"/>
    <rect x="2" y="42" width="7" height="4" rx="1"/>
    <rect x="55" y="18" width="7" height="4" rx="1"/>
    <rect x="55" y="30" width="7" height="4" rx="1"/>
    <rect x="55" y="42" width="7" height="4" rx="1"/>
  </g>

  <!-- Chip Package Body -->
  <rect x="9" y="9" width="46" height="46" rx="4" fill="url(#chip-bg)"/>
  <rect x="11" y="11" width="42" height="42" rx="2.5" fill="none" stroke="#a5f3fc" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- 3 QR Finder Squares inside the IC Die -->
  <rect x="16" y="16" width="13" height="13" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="20" y="20" width="5" height="5" fill="#ffffff"/>

  <rect x="35" y="16" width="13" height="13" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="39" y="20" width="5" height="5" fill="#38bdf8"/>

  <rect x="16" y="35" width="13" height="13" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="20" y="39" width="5" height="5" fill="#34d399"/>

  <!-- Bottom-Right Colorful Hardware LED / Circuit Pads -->
  <rect x="35" y="35" width="4.5" height="4.5" rx="0.8" fill="#fbbf24"/>
  <rect x="43.5" y="35" width="4.5" height="4.5" rx="0.8" fill="#38bdf8"/>
  <rect x="35" y="43.5" width="4.5" height="4.5" rx="0.8" fill="#34d399"/>
  <rect x="41" y="41" width="7" height="7" rx="1.2" fill="#f472b6"/>
</svg>
